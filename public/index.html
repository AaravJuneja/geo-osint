<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>OSINT</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="preload" href="/assets/panorama/preview.jpg" as="image" fetchpriority="high" />
    <link rel="preload" href="/assets/panorama/config.json" as="fetch" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.css" />
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <main class="viewer-shell">
      <div id="panorama" class="panorama"></div>
    </main>
    <section class="guess-panel" id="guessPanel">
      <button class="guess-toggle" id="guessToggle" type="button">submit coordinates</button>
      <form class="guess-box" id="guessForm" autocomplete="off">
        <label>
          <span>latitude</span>
          <input id="latitudeInput" name="lat" type="number" inputmode="decimal" step="any" min="-90" max="90" required />
        </label>
        <label>
          <span>longitude</span>
          <input id="longitudeInput" name="lng" type="number" inputmode="decimal" step="any" min="-180" max="180" required />
        </label>
        <div id="coordinateMap" class="coordinate-map"></div>
        <div class="guess-actions">
          <button id="checkGuess" type="submit">check</button>
          <span id="guessResult" aria-live="polite"></span>
        </div>
      </form>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.js"></script>
    <script src="/assets/app.js" type="module"></script>
  </body>
</html>
